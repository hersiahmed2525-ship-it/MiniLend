<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MiniLend</title>

    <!-- Bootstrap CSS -->
    <link href="node_modules/bootstrap/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- My own CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-light">

    <!-- Header -->
    <header class="bg-dark text-white text-center py-4">
        <h1>📒 MiniLend</h1>
        <p class="opacity-75">Track what you lend. Never forget again.</p>
    </header>

    <!-- Main content -->
    <main class="container my-4">

        <!-- Error message -->
        <div id="error-message" class="alert alert-danger d-none" role="alert">
        </div>

        <!-- Categories and filter -->
        <section class="d-flex flex-wrap align-items-center gap-2 mb-4">

            <div id="categoryList" class="d-flex flex-wrap gap-2">
            </div>

            <button id="addCategoryBtn" class="btn btn-outline-dark btn-sm">
                + Category
            </button>

            <select id="filterSelect" class="form-select form-select-sm w-auto ms-auto">
                <option value="all">All items</option>
                <option value="overdue">Overdue</option>
            </select>

        </section>

        <!-- Lending cards -->
        <section class="card shadow-sm">
            <div class="card-body">

                <div class="d-flex justify-content-between align-items-center mb-3">

                    <h2 id="activeCategoryTitle" class="h5">
                        Select a category
                    </h2>

                    <button id="addCardBtn" class="btn btn-dark btn-sm" disabled>
                        + Add Lend Card
                    </button>

                </div>

                <!-- JavaScript adds cards here -->
                <div id="cardList" class="row g-3">
                </div>

                <!-- Message when there are no cards -->
                <p id="emptyMessage" class="text-center text-muted py-4 d-none">
                    No lend cards yet. Add one!
                </p>

            </div>
        </section>

    </main>

    <!-- Footer -->
    <footer class="bg-dark text-white text-center py-3 mt-auto">
        <p class="mb-1">Author: Hersi Ahmed</p>

        <p class="mb-0">
            <a href="https://github.com/hersiahmed2525-ship-it/" class="text-white">
                Follow me on GitHub
            </a>
        </p>
    </footer>

    <!-- Modal for adding categories and lending cards -->
    <div class="modal fade" id="myModal" tabindex="-1">

        <div class="modal-dialog">
            <div class="modal-content">

                <form id="modalForm">

                    <!-- Modal header -->
                    <div class="modal-header">
                        <h2 class="modal-title fs-5" id="modalTitle">
                        </h2>

                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close">
                        </button>
                    </div>

                    <!-- JavaScript adds form fields here -->
                    <div class="modal-body">
                        <div id="modalFields">
                        </div>
                    </div>

                    <!-- Modal buttons -->
                    <div class="modal-footer">

                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                            Cancel
                        </button>

                        <button type="submit" class="btn btn-dark">
                            Save
                        </button>

                    </div>

                </form>

            </div>
        </div>

    </div>

    <!-- Bootstrap JavaScript -->
    <script src="node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>

    <!-- My JavaScript -->
    <script src="script.js"></script>

</body>

</html>
