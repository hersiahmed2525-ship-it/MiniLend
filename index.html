<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- Bootstrap 5 CSS (CDN) -->
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
     <!-- My custom styles (small tweaks on top of Bootstrap) -->
        <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-light">
    <!-- ===== HEADER ===== -->
    <header class="bg-dark text-white py-4 text-center">
        <h1 class="mb-1">📒 MiniLend</h1>
        <p class="mb-0 opacity-75 small">Track what you lend. Never forget again.</p>
    </header>
    <!-- ===== MAIN ===== -->
    <main class="container py-4">
        <!-- Category bar -->
        <section class="d-flex flex-wrap gap-2 align-items-center mb-4">
            <div id="categoryList" class="d-flex flex-wrap gap-2"></div>
            <button id="addCategoryBtn" class="btn btn-dark btn-sm">+ Category</button>
        </section>
        <!-- Content panel -->
        <section class="card shadow-sm">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
                    <h2 id="activeCategoryTitle" class="h5 mb-0">Select a category</h2>
                    <button id="addCardBtn" class="btn btn-dark btn-sm" disabled>+ Add Lend Card</button>
                </div>
    
                <div id="cardList" class="row g-3"></div>
                <p id="emptyMessage" class="text-center text-muted py-4 mb-0">
                    No lend cards yet. Add one!
                </p>
            </div>
        </section>
    </main>
    <footer class="bg-dark text-white py-4 text-center">
            <p>Author: Hege Refsnes</p>
            <p><a href="https://github.com/hersiahmed2525-ship-it/">Follow for more from GitHub</a></p>
        </footer>
    </footer>
    <!-- ===== MODAL (Bootstrap handles show/hide) ===== -->
    <div class="modal fade" id="myModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <form id="modalForm">
                    <div class="modal-header">
                        <h5 class="modal-title" id="modalTitle">New Item</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <div id="modalFields"></div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-dark">Save</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <!-- Boostrap Script & Main Script-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
